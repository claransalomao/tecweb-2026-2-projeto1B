{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">#{{ tag.name }}</span>
  <a class="btn" href="{% url 'tags_list' %}">Voltar às tags</a>
</div>

<main class="container">
  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ note.title }}</h3>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
      <div class="card-actions">
        <a class="btn" href="{% url 'edit_note' note.id %}">Editar</a>
        <form method="post" action="{% url 'delete_note' note.id %}">
          {% csrf_token %}
          <button class="btn" type="submit">Excluir</button>
        </form>
      </div>
    </div>
    {% empty %}
    <p>Nenhuma anotação com essa tag ainda.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
