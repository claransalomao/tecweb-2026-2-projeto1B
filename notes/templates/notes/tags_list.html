{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Tags</span>
  <a class="btn" href="{% url 'index' %}">Voltar</a>
</div>

<main class="container">
  <table class="tag-table">
    <thead>
      <tr>
        <th>Tag</th>
        <th>Notas</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tags %}
      <tr>
        <td><a class="tag-link" href="{% url 'tag_detail' tag.id %}">#{{ tag.name }}</a></td>
        <td>{{ tag.notes.count }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2">Nenhuma tag cadastrada ainda.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</main>
{% endblock %}
