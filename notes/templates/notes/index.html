{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<main class="container">
  <form class="form-card" method="post">
    {% csrf_token %}
    <input
      class="form-card-title"
      id="titulo"
      type="text"
      name="titulo"
      placeholder="Título"
    />
    <textarea
      class="autoresize"
      id="detalhes"
      name="detalhes"
      placeholder="Digite o conteúdo..."
    ></textarea>
    <button class="btn" type="submit">Criar</button>
  </form>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ note.title }}</h3>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
      <div class="card-actions">
        <a class="btn" href="{% url 'edit_note' note.id %}">Editar</a>
        <form method="post" action="{% url 'delete_note' note.id %}">
          {% csrf_token %}
          <button class="btn" type="submit">Excluir</button>
        </form>
      </div>
    </div>
    {% endfor %}
  </div>
</main>
{% endblock %}
